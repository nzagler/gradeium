name: gradeium

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gradeium}
      POSTGRES_USER: ${POSTGRES_USER:-gradeium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  gradeium:
    image: gradeium:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GRADEIUM_DATABASE_URL: postgres://${POSTGRES_USER:-gradeium}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gradeium}?sslmode=disable
      GRADEIUM_LISTEN_ADDRESS: :8080
      GRADEIUM_CONFIG_DIR: /config
      GRADEIUM_BACKUPS_DIR: /backups
      GRADEIUM_WEB_DIR: /app/frontend
      GRADEIUM_LOG_LEVEL: ${GRADEIUM_LOG_LEVEL:-info}
    ports:
      - "${GRADEIUM_PORT:-8080}:8080"
    volumes:
      - gradeium-config:/config
      - gradeium-backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/gradeium", "healthcheck", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres-data:
  gradeium-config:
  gradeium-backups:
